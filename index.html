
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>KEIBA ONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px}
header{text-align:center;padding:22px 0}
h1{font-size:30px;letter-spacing:2px;margin:0;color:#f4c95d}
.sub{color:#aab5c5;font-size:12px;margin-top:7px}
.panel{background:#1c293b;border:1px solid #34445a;border-radius:15px;padding:17px;margin:15px 0}
h2{font-size:17px;margin:0 0 15px}
label{display:block;color:#b9c5d5;font-size:13px;margin:12px 0 6px}
select,input,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #52627a;background:#101827;color:white;font-size:16px}
button{width:100%;border:0;border-radius:10px;padding:15px;background:#e9bd4c;color:#172033;font-weight:bold;font-size:17px;margin-top:17px}
button:active{opacity:.8}
.result{border-left:4px solid #e9bd4c;padding:12px;background:#26364b;border-radius:8px;margin-top:12px}
.muted{font-size:12px;color:#aab5c5;line-height:1.7}
#message{color:#f4c95d;font-size:14px;margin-top:12px}
footer{text-align:center;color:#718096;font-size:11px;margin:25px 0}
</style>
</head>
<body>
<header>
<h1>KEIBA ONE</h1>
<div class="sub">競馬予想シミュレーター</div>
</header>

<section class="panel">
<h2>レース設定</h2>
<label>開催日</label>
<input type="date" id="date">
<label>競馬場</label>
<select id="course">
<option>東京</option><option>中山</option><option>京都</option>
<option>阪神</option><option>新潟</option><option>福島</option>
<option>小倉</option><option>札幌</option><option>函館</option>
<option>中京</option>
</select>
<label>レース番号</label>
<select id="race">
</select>
<button onclick="prepare()">このレースを選択</button>
<div id="message"></div>
</section>

<section class="panel">
<h2>予想結果</h2>
<div class="result">
<strong>軸馬</strong>
<p id="axis">レースを選択してください</p>
</div>
<div class="result">
<strong>期待値候補</strong>
<p id="hole">出走馬データの取得後に分析します</p>
</div>
<p class="muted">各馬の能力・コース適性・距離適性・近走内容・展開を分析し、軸馬1頭と期待値候補1頭を選びます。</p>
</section>

<section class="panel">
<h2>出走馬データ</h2>
<p class="muted">次の開発段階で、選択したレースの出走馬を自動取得する機能を接続します。現在はまだデータ取得・自動予想には対応していません。</p>
<div id="entries"></div>
</section>

<footer>KEIBA ONE</footer>

<script>
const race=document.getElementById("race");
for(let i=1;i<=12;i++){
 const op=document.createElement("option");
 op.value=i;op.textContent=i+"R";race.appendChild(op);
}
document.getElementById("date").value=new Date().toLocaleDateString("sv-SE");
function prepare(){
 const d=document.getElementById("date").value;
 const c=document.getElementById("course").value;
 const r=race.value;
 if(!d){document.getElementById("message").textContent="開催日を選択してください";return;}
 document.getElementById("message").textContent=
 d+" "+c+"競馬場 "+r+"R を選択しました。";
 document.getElementById("axis").textContent="出走馬データの取得待ち";
 document.getElementById("hole").textContent="出走馬データの取得待ち";
loadEntries(d,c,r);}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL ="https://yvaqilfhhvoofsagibkk.supabase.co";
const SUPABASE_KEY ="sb_publishable_u8MierJ7JBI9wY4ZrB4YAA_Wm9zQCTc";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const testButton = document.createElement("button");
testButton.textContent = "データベース接続テスト";
testButton.style.marginTop = "10px";
document.body.appendChild(testButton);

const status = document.createElement("p");
status.style.textAlign = "center";
status.style.fontSize = "13px";
testButton.after(status);

testButton.onclick = async () => {
  status.textContent = "接続確認中...";
  const { data, error } = await db
    .from("race_entries")
    .select("id")
    .limit(1);

  if (error) {
    status.textContent = "接続エラー：" + error.message;
  } else {
    status.textContent = "Supabase接続成功！";
  }
};
async function loadEntries(d,c,r) {
  const area = document.getElementById("entries");
  area.textContent = "出走馬データを読み込み中...";

  const { data, error } = await db
    .from("race_entries")
    .select("horse_number,horse_name,jockey,weight,running_style,total_ability,course_aptitude,distance_aptitude,recent_form")
    .eq("race_date", d)
    .eq("course", c)
    .eq("race_number", Number(r))
    .order("horse_number", { ascending: true });

  if (error) {
    area.textContent = "読み込みエラー：" + error.message;
    return;
  }

  if (!data || data.length === 0) {
    area.textContent = "このレースの出走馬データはまだ登録されていません。";
    return;
  }

  area.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = "出走馬一覧";
  area.appendChild(heading);

  data.forEach(horse => {
    const item = document.createElement("p");
    item.textContent =
      horse.horse_number + "番 " +
      horse.horse_name + " ／ " +
      (horse.jockey || "騎手未登録") + " ／ " +
      (horse.weight ?? "斤量未登録") + "kg ／ " +
      (horse.running_style || "脚質未登録");

    area.appendChild(item);
  });
    predictHorses(data);
}

function predictHorses(data) {
  const axis = document.getElementById("axis");
  const hole = document.getElementById("hole");

  const fields = [
    "total_ability",
    "course_aptitude",
    "distance_aptitude",
    "recent_form"
  ];

  const scored = data.map(horse => {
    let total = 0;
    let count = 0;

    fields.forEach(field => {
      const value = Number(horse[field]);
      if (horse[field] !== null &&
          horse[field] !== "" &&
          Number.isFinite(value) &&
          value > 0) {
        total += value;
        count++;
      }
    });

    return {
      ...horse,
      score: count ? total / count : 0,
      count
    };
  });

  const valid = scored.filter(h => h.count > 0);

  if (valid.length < 2) {
    axis.textContent = "評価データが不足しています";
    hole.textContent = "能力・適性などの登録が必要です";
    return;
  }

  valid.sort((a, b) => b.score - a.score);

  axis.textContent =
    valid[0].horse_number + "番 " +
    valid[0].horse_name +
    "（評価 " + valid[0].score.toFixed(1) + "）";

  hole.textContent =
    valid[1].horse_number + "番 " +
    valid[1].horse_name +
    "（暫定候補 " + valid[1].score.toFixed(1) + "）";
}

</script>
</body>
</html>
